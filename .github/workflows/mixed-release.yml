name: mixed-release

on:
  push:
    tags:
      - "v26.10.21-mixed.*"

permissions:
  contents: write

jobs:
  release:
    name: release linux/amd64
    runs-on: ubuntu-latest
    env:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: "0"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Build
        run: |
          mkdir -p build build_assets
          go build \
            -trimpath \
            -buildvcs=false \
            -gcflags="all=-l=4" \
            -ldflags="-X github.com/xtls/xray-core/core.build=${GITHUB_SHA::8} -s -w -buildid=" \
            -o build/xray \
            ./main
          file build/xray

      - name: Package
        run: |
          cp build/xray build_assets/xray
          cp README.md LICENSE build_assets/
          cp build/xray xray-linux-amd64

          pushd build_assets
          zip -9vr ../Xray-linux-64.zip .
          popd

          {
            echo "# Hash Values"
            echo
            echo "MD5= $(md5sum Xray-linux-64.zip | awk '{print $1}')"
            echo "SHA1= $(sha1sum Xray-linux-64.zip | awk '{print $1}')"
            echo "SHA2-256= $(sha256sum Xray-linux-64.zip | awk '{print $1}')"
            echo "SHA2-512= $(sha512sum Xray-linux-64.zip | awk '{print $1}')"
          } > Xray-linux-64.zip.dgst

          sha256sum xray-linux-amd64 | awk '{print $1 "  xray-linux-amd64"}' > xray-linux-amd64.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: xray-linux-amd64-release
          path: |
            Xray-linux-64.zip
            Xray-linux-64.zip.dgst
            xray-linux-amd64
            xray-linux-amd64.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              Xray-linux-64.zip \
              Xray-linux-64.zip.dgst \
              xray-linux-amd64 \
              xray-linux-amd64.sha256 \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              Xray-linux-64.zip \
              Xray-linux-64.zip.dgst \
              xray-linux-amd64 \
              xray-linux-amd64.sha256 \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
