name: mixed-ci

on:
  push:
    branches:
      - fork/mixed-usermanager
  workflow_dispatch:
    inputs:
      run_full_tests:
        description: Run the full go test ./... suite
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mixed-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build linux/amd64
    runs-on: ubuntu-latest
    env:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Show toolchain
        run: go version

      - name: Build
        run: |
          mkdir -p build
          go build \
            -trimpath \
            -buildvcs=false \
            -gcflags="all=-l=4" \
            -ldflags="-X github.com/xtls/xray-core/core.build=${GITHUB_SHA::8} -s -w -buildid=" \
            -o build/xray \
            ./main

      - name: Inspect binary
        run: |
          file build/xray
          ls -lh build/xray

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: xray-linux-amd64
          path: build/xray
          if-no-files-found: error
          retention-days: 7

  test:
    name: full test suite
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_full_tests }}
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Test
        run: go test -timeout 45m ./...
